<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillTrack - Student Skill Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">SkillTrack</div>
    <p>Student Skill Progress Tracker</p>
</header>

<main class="container">

    <!-- Dashboard -->
    <section class="dashboard">
        <div class="stat-card">
            <h3 id="totalSkills">0</h3>
            <p>Total Skills</p>
        </div>

        <div class="stat-card">
            <h3 id="completedSkills">0</h3>
            <p>Completed</p>
        </div>

        <div class="stat-card">
            <h3 id="averageProgress">0%</h3>
            <p>Average Progress</p>
        </div>
    </section>

    <!-- Add Skill -->
    <section class="form-section">
        <h2>Add New Skill</h2>

        <form id="skillForm">

            <div class="input-group">
                <label>Skill Name</label>
                <input type="text" id="skillName"
                       placeholder="Example: JavaScript" required>
            </div>

            <div class="input-group">
                <label>Category</label>
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Programming">Programming</option>
                    <option value="Database">Database</option>
                    <option value="Communication">Communication</option>
                    <option value="Design">Design</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="input-group">
                <label>Progress: <span id="progressValue">0%</span></label>
                <input type="range" id="progress"
                       min="0" max="100" value="0">
            </div>

            <button type="submit">Add Skill</button>

        </form>
    </section>

    <!-- Search -->
    <section class="search-section">
        <input type="text" id="search"
               placeholder="Search skills...">

        <select id="filter">
            <option value="All">All Categories</option>
            <option value="Programming">Programming</option>
            <option value="Database">Database</option>
            <option value="Communication">Communication</option>
            <option value="Design">Design</option>
            <option value="Other">Other</option>
        </select>
    </section>

    <!-- Skills -->
    <section>
        <h2 class="section-title">My Skills</h2>
        <div id="skillList"></div>
    </section>

</main>

<footer>
    <p>© 2026 SkillTrack | Student Mini Project</p>
</footer>

<script src="script.js"></script>

</body>
</html>
